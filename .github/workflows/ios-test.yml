# Swift unit tests on the iOS SIMULATOR. Separate from the .ipa build so the
# device artifact stays fast and independent. Builds the FFI for the simulator
# arch (aarch64-apple-ios-sim), generates the uniffi Swift bindings, and runs the
# padMuleTests bundle inside the padMule app on a booted iPad simulator. No Apple
# credentials (unsigned, CODE_SIGNING_ALLOWED=NO). See ios/padMuleTests/.
name: iOS unit tests (simulator)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-test.yml"
  pull_request:
    paths:
      - "crates/**"
      - "ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-test.yml"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Rust toolchain + iOS simulator target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-sim-${{ hashFiles('Cargo.lock') }}

      # The engine, compiled for the iOS simulator (Apple-silicon runners).
      - name: Build mule-ffi staticlib (aarch64-apple-ios-sim)
        run: cargo build -p mule-ffi --release --target aarch64-apple-ios-sim

      # Bindings are arch-independent, generated from the HOST cdylib.
      - name: Generate Swift bindings
        run: |
          cargo build -p mule-ffi --release
          cargo run -q -p mule-ffi --bin uniffi-bindgen -- generate \
            --library target/release/libmule_ffi.dylib \
            --language swift \
            --out-dir ios/gen
          mv ios/gen/mule_ffiFFI.modulemap ios/gen/module.modulemap
          ls -la ios/gen

      - name: Stage the simulator staticlib for the linker
        run: |
          mkdir -p ios/libs-sim
          cp target/aarch64-apple-ios-sim/release/libmule_ffi.a ios/libs-sim/
          ls -la ios/libs-sim

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick an available iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          ids = [d['udid'] for rt in devs for d in devs[rt] if 'iPad' in d['name']]
          print(ids[0] if ids else '')
          ")
          if [ -z "$UDID" ]; then
            # Pick a CURRENT iPad device type instead of hardcoding one: named
            # types get retired across Xcode releases (the old "iPad Pro
            # (11-inch) (4th generation)" no longer exists on macos-latest).
            DTYPE=$(xcrun simctl list devicetypes --json | python3 -c "
          import json, sys
          types = json.load(sys.stdin)['devicetypes']
          pads = [t['identifier'] for t in types if 'iPad' in t['name']]
          print(pads[-1] if pads else '')
          ")
            [ -n "$DTYPE" ] || { echo "no iPad device type available"; exit 1; }
            echo "No iPad simulator available; creating one ($DTYPE)."
            UDID=$(xcrun simctl create padMule-iPad "$DTYPE")
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          cd ios
          xcodebuild test \
            -project padMule.xcodeproj \
            -scheme padMule \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # THE RENDERED BADGE STATES. VpnBadgeTests attaches a PNG of the VPN badge
      # in both states (and inside a real toolbar) on every run, because the
      # defect that prompted them was invisible to every assertion padMule had -
      # the accessibility tree read "VPN on" while the screen read "... ...".
      # An assertion says a number is right; these say what a person would see.
      # Extracted from the result bundle so they can be looked at without Xcode.
      - name: Extract rendered view attachments
        if: always()
        run: |
          mkdir -p ios/rendered
          # xcresulttool's legacy reader is what exposes attachments by name; the
          # flag is required on Xcode 16+ and harmless before it.
          xcrun xcresulttool export attachments \
            --path ios/TestResults.xcresult \
            --output-path ios/rendered 2>/dev/null \
            || echo "no attachments exported (older xcresulttool) - the .xcresult still has them"
          ls -la ios/rendered || true

      - name: Upload rendered views + test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-views
          path: |
            ios/rendered
            ios/TestResults.xcresult
          if-no-files-found: warn
